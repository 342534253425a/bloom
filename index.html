<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f4fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Small habits. A brighter day." />
    <link rel="icon" href="/img/c-wave.webp" />
    <link rel="apple-touch-icon" href="/mascot/wave.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: Google Fonts is unreachable in some countries and must never hold the page blank. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Pangolin&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      html,body{margin:0;background:#f6f4fb}
      .boot{position:fixed;inset:0;display:grid;place-items:center;font:600 15px system-ui,sans-serif;color:#8f97ab}
      .boot img{width:96px;height:96px;animation:boot 1.4s ease-in-out infinite}
      @keyframes boot{50%{transform:translateY(-8px)}}
    </style>
    <title>Bloom</title>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/img/c-wave.webp" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
